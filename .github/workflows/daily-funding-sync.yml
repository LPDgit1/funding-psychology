name: Daily funding sync

on:
  # GitHub cron is UTC: 04:00 UTC is approximately 05:00 CET / 06:00 CEST
  # in Europe/Rome.  The exact minute is intentionally not significant.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-funding-sync
  cancel-in-progress: false

jobs:
  sync-publish-data:
    runs-on: ubuntu-latest
    # The live run includes bounded detail enrichment and can take roughly
    # half an hour on a slow upstream day; keep a finite one-hour ceiling.
    timeout-minutes: 60
    steps:
      - name: Check out the public source branch
        uses: actions/checkout@v5
        with:
          ref: github-ready
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch, normalize, validate and write the latest snapshot
        run: python -m funding_core.cli daily-sync

      - name: Validate the written snapshot envelopes
        run: python -m funding_core.cli validate-snapshot

      - name: Publish generated data to the source branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opportunities-current.json \
            public/data/opportunities-archive.json \
            public/data/opportunities.json \
            reports/daily-sync-latest.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore(data): daily funding sync [skip ci]"
            git push origin HEAD:github-ready
          fi
